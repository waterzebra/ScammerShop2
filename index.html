<!DOCTYPE html>

<html>
<body> Test123

<button id ="Money" onclick="give()">10</button>

<button id ="jordans" onclick="jordan()">Buy Jordans $10</button>

<button id ="caN" onclick="NitroCan()">Buy Canned Nitrogen $15</button>

<button id ="Checkou2ah" onclick="checkout()">Checkout</button>

<button id ="cc" onclick="Ccart()">Clear Cart</button>

<button id ="Tutorial" onclick="tutorial()">Toggle Music</button>

<button id ="Help" onclick="help()">Help</button>

<script>

let mny = new Audio("ChaChing.mp3")

let pop = new Audio("pop.mp3")

let popz = new Audio("pop.mp3")

let clear = new Audio("ClearC.mp3")

let music = new Audio("audiogroup2.mp3")

let SadVG = new Audio("ClearC.mp3")

document.getElementById("Money").style.height = "30px"

document.getElementById("jordans").style.height = "30px"

document.getElementById("caN").style.height = "30px"

document.getElementById("Checkou2ah").style.height = "30px"

document.getElementById("cc").style.height = "30px"

document.getElementById("Tutorial").style.height = "30px"

document.getElementById("Help").style.height = "30px"

document.body.style.backgroundColor = "grey";

let money = 10

let MPC = 0

let J = 0

let NC = 0

let due = 0

let MT = 0

let cd = 0

function tutorial() {
if (cd === 0) {
cd = 1
if (MT === 0) {
MT = 1;
music.play();
music.loop = true
pop.play();
} 
else {
MT = 0;
music.pause();
music.currentTime = 0;
popz.play();
}
}
cd = 0
}
  
function jordan() {
J = (J + 1)
pop.play();
alert("Added Jordans to cart.")
}

function NitroCan() {
NC = (NC + 1)
pop.play();
alert("Added canned nitrogen to cart.")
}

function checkout() {
due = (due + (10 * J))
due = (due + (15 * NC))
if (money >= due) {
money = (money - due)
document.getElementById("Money").innerText = money
MPC = (MPC + (due / 10))
mny.play()
if (MPC > 0) {
J = 0
NC = 0
due = 0
}
}
}

function give() {
money = (money + MPC)
document.getElementById("Money").innerText = money
}

function Ccart() {
J = 0
NC = 0
if (J === 0) {
clear.play();
}
}

function help() {
pop.play();
alert("You have 10 money, (it shows your money where it shows the number) Click an item to add it to your cart, when you are finished shopping, click checkout. If you do not have enough, the checkout button will not work. Click clear cart to clear your cart.")
}

</script>

</body>
</html>
